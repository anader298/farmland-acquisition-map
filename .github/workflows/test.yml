# Runs the tests on every push to main and every pull request. Deploys nothing.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (standard library only)
        run: python -m unittest discover tests -v
      - name: Full build on the synthetic sample
        run: python -m pipeline.build
